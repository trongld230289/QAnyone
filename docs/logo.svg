<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-label="QAnyone — QA + Anyone · Playwright automation for everyone">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4EC"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="420" height="96" rx="20" fill="#0B1220"/>
  <!-- mark: an A (anyone) and an inverted A share one centre — A turns into A — while an arrow loops around them (automation, AI) -->
  <g transform="translate(16 16)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M56.43 23.11 A26 26 0 1 1 36.51 6.4 M29.73 10.29 L36.51 6.4 L31.47 0.43" stroke="url(#g)" stroke-width="3.5"/>
    <path d="M19 18 L32 49 L45 18 M24.5 28 H39.5" stroke="url(#g)" stroke-width="4"/>
    <path d="M19 46 L32 15 L45 46 M24.5 36 H39.5" stroke="#E8EEF6" stroke-width="4"/>
  </g>
  <!-- wordmark -->
  <text x="96" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.8" fill="#E8EEF6">QAnyone</text>
  <text x="97" y="70" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8DA1BD">QA + Anyone · Playwright automation for everyone</text>
</svg>
